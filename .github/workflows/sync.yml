name: sync-from-main-site
on: {schedule: [{cron: "17 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {sync: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {run: "git fetch https://github.com/chabadchagrin/menorahatthefalls.git main && git checkout FETCH_HEAD -- . && echo menorah.jewishchagrinfalls.com > CNAME && git config user.name sync && git config user.email sync@users.noreply.github.com && git add -A && (git diff --cached --quiet || git commit -m sync) && git push"}]}}
